# Production environment: application container connected to external PostgreSQL and Redis.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-house:prod}
    restart: unless-stopped
    env_file:
      - ${PROD_ENV_FILE:-.env.prod}
    environment:
      SERVER_ADDRESS: 0.0.0.0:8080
    ports:
      - "${APP_PORT:-8080}:8080"
